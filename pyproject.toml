[project]
name = "msys2-texlive"
version = "0.1.0"
description = ""
authors = [{ name = "Naveen M K", email = "naveen521kk@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "requests>=2.25.1,<3",
    "PyGithub>=1.54.1,<2",
    "Jinja2>=2.11.3,<3",
]

[project.scripts]
msys2-texlive = "texlive.__main__:main"

[project.entry-points]

[dependency-groups]
dev = [
    "mypy>=1,<2",
    "flake8>=6,<7",
    "black>=23.3,<24",
    "pytest>=7.2,<8",
    "coverage>=7,<8",
    "pytest-cov>=4,<5",
    "hypothesis>=6.10,<7",
    "types-requests>=2,<3",
    "types-Jinja2>=2,<3",
]

[tool.uv]

[tool.uv.build-backend]
module-name = ["texlive"]
module-root = ""

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.isort]
# from https://black.readthedocs.io/en/stable/compatible_configs.html
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.coverage.run]
omit = ["*tests*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]

[tool.pytest.ini_options]
addopts = "--cov=texlive --cov-report xml --cov-report term"
